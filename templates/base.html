<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Garden Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; background: #f7f7f2; }
        h1 { color: #2e5339; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #2e5339; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #2e5339; color: white; }
        tr:nth-child(even) { background: #f0f0e8; }
        form { background: white; padding: 20px; border-radius: 6px; max-width: 500px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 18px; background: #2e5339; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #244029; }
        .delete-btn { background: #a13d3d; padding: 4px 10px; font-size: 12px; }
        .delete-btn:hover { background: #7e2f2f; }
        .filter-bar { margin-bottom: 15px; background: white; padding: 10px 15px; border-radius: 6px; display: inline-block; }
        .filter-bar select { display: inline; width: auto; margin-left: 8px; }
        .catalog-card { background: white; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .catalog-section { white-space: pre-line; margin-bottom: 15px; line-height: 1.5; }
        .catalog-section h4 { margin-bottom: 4px; color: #2e5339; }
        .result-box { background: white; padding: 20px; border-radius: 6px; max-width: 600px; margin-top: 15px; }
        .cal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .cal-month { background: white; border-radius: 6px; padding: 12px; border: 2px solid transparent; }
        .cal-month.current { border-color: #2e5339; box-shadow: 0 0 0 2px #cfe3d6; }
        .cal-month h3 { margin: 0 0 8px 0; color: #2e5339; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 12px; margin: 2px 4px 2px 0; }
        .tag-plant { background: #d9f0e1; color: #1e4a2d; }
        .tag-harvest { background: #fbe8c6; color: #8a5a00; }
    </style>
</head>
<body>
    <h1>🌱 Garden Tracker</h1>
    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('calendar_view') }}">Calendar</a>
        <a href="{{ url_for('log_list') }}">View Log</a>
        <a href="{{ url_for('add_entry') }}">Add Entry</a>
        <a href="{{ url_for('manage_plants') }}">Manage My Plants</a>
        <a href="{{ url_for('catalog_list') }}">Plant Catalog</a>
        <a href="{{ url_for('manage_ingredients') }}">Ingredients</a>
        <a href="{{ url_for('mix_calculator') }}">Fertiliser Mix</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
