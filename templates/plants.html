{% extends "base.html" %}
{% block content %}
<h2>Manage Plants</h2>

<table style="margin-bottom:25px;">
    <tr>
        <th>Name</th>
        <th>Catalog Type</th>
    </tr>
    {% for p in plants %}
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.catalog_name if p.catalog_name else (p.plant_type if p.plant_type else '') }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2">No plants yet.</td></tr>
    {% endfor %}
</table>

<form method="POST">
    <label for="name">Plant Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Banana Clump, Tomato Bed" required>

    <label for="catalog_id">Catalog Type</label>
    <select id="catalog_id" name="catalog_id" required>
        {% for c in catalog %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
    </select>

    <button type="submit">Add Plant</button>
</form>
{% endblock %}
