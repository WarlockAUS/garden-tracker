{% extends "base.html" %}
{% block content %}
<h2>Edit Catalog Entry: {{ entry.name }}</h2>
<form method="POST">
    <label>Plant Name</label>
    <input type="text" value="{{ entry.name }}" disabled>

    <label for="feed_frequency_days">Feed Frequency (days)</label>
    <input type="number" id="feed_frequency_days" name="feed_frequency_days" value="{{ entry.feed_frequency_days if entry.feed_frequency_days is not none else '' }}">

    <label>Target NPK Ratio</label>
    <div style="display:flex; gap:8px;">
        <input type="number" step="0.1" name="npk_n" value="{{ entry.npk_n if entry.npk_n is not none else '' }}" placeholder="N">
        <input type="number" step="0.1" name="npk_p" value="{{ entry.npk_p if entry.npk_p is not none else '' }}" placeholder="P">
        <input type="number" step="0.1" name="npk_k" value="{{ entry.npk_k if entry.npk_k is not none else '' }}" placeholder="K">
    </div>

    <label>Planting Months (comma-separated, 1-12)</label>
    <input type="text" name="plant_months" value="{{ entry.plant_months or '' }}" placeholder="e.g. 8,9,10">

    <label>Harvest Months (comma-separated, 1-12)</label>
    <input type="text" name="harvest_months" value="{{ entry.harvest_months or '' }}" placeholder="e.g. 11,12,1">

    <label>Plant Family (e.g. Nightshade, Legume, Brassica, Cucurbit, Allium, Root Vegetable, Herb, Fruit Tree)</label>
    <input type="text" name="plant_family" value="{{ entry.plant_family or '' }}" placeholder="e.g. Nightshade">

    <label for="npk_ratio">NPK Ratio & Blend (reference text)</label>
    <textarea id="npk_ratio" name="npk_ratio" rows="4">{{ entry.npk_ratio or '' }}</textarea>

    <label for="dosing_rules">Dosing Rules</label>
    <textarea id="dosing_rules" name="dosing_rules" rows="4">{{ entry.dosing_rules or '' }}</textarea>

    <label for="seasonal_notes">Seasonal Schedule</label>
    <textarea id="seasonal_notes" name="seasonal_notes" rows="4">{{ entry.seasonal_notes or '' }}</textarea>

    <label for="deficiency_guide">Deficiency Guide</label>
    <textarea id="deficiency_guide" name="deficiency_guide" rows="4">{{ entry.deficiency_guide or '' }}</textarea>

    <label for="mulch_notes">Mulching Notes</label>
    <textarea id="mulch_notes" name="mulch_notes" rows="4">{{ entry.mulch_notes or '' }}</textarea>

    <button type="submit">Save Changes</button>
</form>
<p><a href="{{ url_for('catalog_detail', catalog_id=entry.id) }}">← Back to Guide</a></p>
{% endblock %}
