{% extends "base.html" %}
{% block content %}
<h2>Add Catalog Entry</h2>
<form method="POST">
    <label for="name">Plant Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Tomato" required>

    <label for="feed_frequency_days">Feed Frequency (days)</label>
    <input type="number" id="feed_frequency_days" name="feed_frequency_days" placeholder="e.g. 42">

    <label>Target NPK Ratio</label>
    <div style="display:flex; gap:8px;">
        <input type="number" step="0.1" name="npk_n" placeholder="N (e.g. 3)">
        <input type="number" step="0.1" name="npk_p" placeholder="P (e.g. 1)">
        <input type="number" step="0.1" name="npk_k" placeholder="K (e.g. 6)">
    </div>

    <label>Planting Months (comma-separated, 1-12)</label>
    <input type="text" name="plant_months" placeholder="e.g. 8,9,10">

    <label>Harvest Months (comma-separated, 1-12)</label>
    <input type="text" name="harvest_months" placeholder="e.g. 11,12,1">

    <label for="npk_ratio">NPK Ratio & Blend (reference text)</label>
    <textarea id="npk_ratio" name="npk_ratio" rows="4"></textarea>

    <label for="dosing_rules">Dosing Rules</label>
    <textarea id="dosing_rules" name="dosing_rules" rows="4"></textarea>

    <label for="seasonal_notes">Seasonal Schedule</label>
    <textarea id="seasonal_notes" name="seasonal_notes" rows="4"></textarea>

    <label for="deficiency_guide">Deficiency Guide</label>
    <textarea id="deficiency_guide" name="deficiency_guide" rows="4"></textarea>

    <label for="mulch_notes">Mulching Notes</label>
    <textarea id="mulch_notes" name="mulch_notes" rows="4"></textarea>

    <button type="submit">Save Catalog Entry</button>
</form>
{% endblock %}
